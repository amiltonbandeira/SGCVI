<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGCVI — Entrar na Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">S</div>
            <h1 class="h4 font-weight-bold mb-1">Entrar no SGCVI</h1>
            <p class="text-muted small">Aceda à gestão da sua carteira imobiliária</p>
        </div>

        <form action="index.html" method="GET">
            <div class="mb-3">
                <label for="email" class="form-label">Endereço de E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="exemplo@imobiliaria.co.ao" required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label mb-0">Palavra-passe</label>
                    <a href="#" class="small text-decoration-none text-primary">Esqueceu-se?</a>
                </div>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label small text-muted" for="remember">Lembrar-me neste dispositivo</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Entrar no Sistema</button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <span class="small text-muted">Ainda não tem uma conta?</span>
            <a href="register.html" class="small fw-bold text-decoration-none ms-1">Criar conta</a>
        </div>
    </div>
</body>
</html>
